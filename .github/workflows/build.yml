name: Bygg Klang

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test kjernen
        run: dotnet test tests/Klang.Core.Tests/Klang.Core.Tests.csproj -c Release

      - name: Bygg appen
        run: dotnet publish src/Klang.App/Klang.App.csproj -c Release -r win-x64 -p:Platform=x64 -o publish/Klang

      - uses: actions/upload-artifact@v4
        with:
          name: Klang-win-x64
          path: publish/Klang
